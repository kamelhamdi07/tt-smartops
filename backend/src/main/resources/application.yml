spring:
  application:
    name: tt-smartops
  datasource:
    # Neon : utiliser l'URL "direct" (non poolée) pour que Flyway fonctionne correctement
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Neon ferme les connexions inactives (mise en veille) : on les sonde et on les renouvelle
      # avant, sinon la première requête après une pause attend 30 s puis échoue.
      keepalive-time: 60000
      max-lifetime: 300000
      validation-timeout: 5000
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # le schéma est géré uniquement par Flyway
    properties:
      hibernate:
        jdbc.time_zone: Africa/Tunis
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}                 # clé Base64 d'au moins 256 bits
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  planning:
    work-start: ${WORK_START:08:00}
    work-end: ${WORK_END:17:00}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    password: ${DEMO_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints.web.exposure.include: health
